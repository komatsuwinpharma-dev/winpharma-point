<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1456a0">
<title>WINpharma POINT</title>

<style>
:root {
  --blue:#1456a0;
  --blue2:#2478c9;
  --orange:#f28a24;
  --bg:#f3f6fa;
  --ink:#18324d;
  --muted:#718096;
}

* {box-sizing:border-box}

body {
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;
  color:var(--ink);
}

.app {
  max-width:480px;
  margin:auto;
  min-height:100vh;
  padding-bottom:30px;
}

header {
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  padding:25px 20px;
  border-radius:0 0 25px 25px;
}

.brand {font-size:12px;letter-spacing:2px}
.title {font-size:23px;font-weight:800;margin-top:7px}

main {padding:16px}

.card {
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 4px 18px #173b5b0d;
}

h2 {font-size:17px;margin:0 0 15px}

input {
  width:100%;
  padding:14px;
  border:1px solid #d8e1eb;
  border-radius:10px;
  font-size:16px;
  margin:7px 0 15px;
}

label {font-size:12px;font-weight:bold}

.btn {
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  background:var(--blue);
  color:white;
  width:100%;
  margin-bottom:10px;
}

.orange {background:var(--orange)}
.light {background:#eaf2fb;color:var(--blue)}

.muted {
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.pointnum {
  font-size:40px;
  font-weight:900;
  color:var(--blue);
  margin:10px 0;
}

.member {
  text-align:center;
  font-size:18px;
  font-weight:bold;
  letter-spacing:2px;
  padding:15px;
  background:#f3f6fa;
  border-radius:10px;
}

.hidden {display:none!important}

.message {
  font-size:13px;
  color:#d46b25;
  margin-bottom:12px;
  line-height:1.6;
}

</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">WINpharma</div>
  <div class="title">WINpharma POINT</div>
  <p>お買い物でポイントを貯めて、特典と交換。</p>
</header>

<main>

<!-- 会員登録・ログイン画面 -->
<section id="authSection">

  <div class="card">

    <h2>WINpharma POINTへようこそ</h2>

    <p class="muted">
      メールアドレスとパスワードで会員登録できます。
    </p>

    <div id="errorMessage" class="message"></div>

    <label>メールアドレス</label>
    <input id="email" type="email" placeholder="example@email.com">

    <label>パスワード（6文字以上）</label>
    <input id="password" type="password" placeholder="パスワード">

    <button class="btn orange" id="registerBtn">
      新規会員登録
    </button>

    <button class="btn" id="loginBtn">
      ログイン
    </button>

  </div>

</section>


<!-- ログイン後の画面 -->
<section id="memberSection" class="hidden">

  <div class="card">

    <h2>こんにちは！</h2>

    <p class="muted">あなたの会員番号</p>

    <div class="member" id="memberNumber">
      読み込み中
    </div>

  </div>


  <div class="card">

    <h2>現在の保有ポイント</h2>

    <div class="pointnum">
      <span id="pointBalance">0</span>
      <small style="font-size:15px">pt</small>
    </div>

    <p class="muted">
      OTC対象商品の購入でポイントが貯まります。
    </p>

  </div>


  <div class="card">

    <h2>会員情報</h2>

    <p class="muted">
      登録メールアドレス
    </p>

    <p id="memberEmail"></p>

    <button class="btn light" id="logoutBtn">
      ログアウト
    </button>

  </div>


  <div class="card">

    <h2>特典交換</h2>

    <p class="muted">
      今後、ポイントを使って景品と交換できるようにします。
    </p>

  </div>

</section>

</main>

<footer style="text-align:center;color:#9aa6b2;font-size:10px">
WINpharma POINT / Prototype
</footer>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDgPnM7g-lHMQ1_KqL-GVuMhJFWuOrXBLg",
  authDomain: "winpharma-point.firebaseapp.com",
  projectId: "winpharma-point",
  storageBucket: "winpharma-point.firebasestorage.app",
  messagingSenderId: "1045028388131",
  appId: "1:1045028388131:web:2847eaf400a71755d62096",
  measurementId: "G-SHM8XCJP9W"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


const authSection = document.getElementById("authSection");
const memberSection = document.getElementById("memberSection");
const errorMessage = document.getElementById("errorMessage");


function showError(message) {
  errorMessage.textContent = message;
}


function translateError(error) {

  const messages = {
    "auth/email-already-in-use":
      "このメールアドレスはすでに登録されています。",
    "auth/invalid-email":
      "メールアドレスを確認してください。",
    "auth/weak-password":
      "パスワードは6文字以上にしてください。",
    "auth/invalid-credential":
      "メールアドレスまたはパスワードが違います。",
    "auth/network-request-failed":
      "通信エラーです。ネット環境を確認してください。"
  };

  return messages[error.code] || "エラーが発生しました。もう一度お試しください。";
}


// 会員登録
document.getElementById("registerBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showError("メールアドレスとパスワードを入力してください。");
    return;
  }

  if (password.length < 6) {
    showError("パスワードは6文字以上にしてください。");
    return;
  }

  try {

    const result = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    const uid = result.user.uid;

    await setDoc(doc(db, "members", uid), {
      uid: uid,
      points: 0,
      createdAt: serverTimestamp()
    });

  } catch (error) {

    showError(translateError(error));

  }

});


// ログイン
document.getElementById("loginBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showError("メールアドレスとパスワードを入力してください。");
    return;
  }

  try {

    await signInWithEmailAndPassword(auth, email, password);

  } catch (error) {

    showError(translateError(error));

  }

});


// ログイン状態の確認
onAuthStateChanged(auth, async (user) => {

  if (user) {

    try {

      const memberRef = doc(db, "members", user.uid);
      let memberDoc = await getDoc(memberRef);

      // 会員データがなければ初期登録
      if (!memberDoc.exists()) {

        await setDoc(memberRef, {
          uid: user.uid,
          points: 0,
          createdAt: serverTimestamp()
        });

        memberDoc = await getDoc(memberRef);

      }

      const memberData = memberDoc.data();

      authSection.classList.add("hidden");
      memberSection.classList.remove("hidden");

      document.getElementById("memberNumber").textContent =
        "WF-" + user.uid.substring(0, 8).toUpperCase();

      document.getElementById("pointBalance").textContent =
        memberData.points ?? 0;

      document.getElementById("memberEmail").textContent =
        user.email;

    } catch (error) {

      showError("会員情報を読み込めませんでした。");
      console.error(error);

    }

  } else {

    authSection.classList.remove("hidden");
    memberSection.classList.add("hidden");

  }

});


// ログアウト
document.getElementById("logoutBtn").addEventListener("click", async () => {

  await signOut(auth);

});

</script>

</body>
</html>
