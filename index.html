<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WINpharma POINT</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root {
  --blue: #1765a8;
  --orange: #f28c28;
  --bg: #f3f6fa;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: sans-serif;
  background: var(--bg);
  color: #333;
}

header {
  background: var(--blue);
  color: white;
  padding: 22px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 23px;
}

header p {
  margin: 5px 0 0;
  font-size: 12px;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

h2 {
  font-size: 18px;
  margin-top: 0;
}

input {
  width: 100%;
  padding: 14px;
  margin: 7px 0 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}

button {
  width: 100%;
  border: none;
  padding: 15px;
  border-radius: 9px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}

.primary {
  background: var(--blue);
  color: white;
}

.orange {
  background: var(--orange);
  color: white;
}

.sub {
  background: #edf2f7;
  color: #333;
}

.balance {
  background: linear-gradient(135deg, #1765a8, #368acb);
  color: white;
  text-align: center;
  padding: 28px 15px;
  border-radius: 15px;
}

.balance small {
  font-size: 14px;
}

.balance strong {
  display: block;
  font-size: 43px;
  margin: 10px 0;
}

.member-number {
  font-size: 13px;
  color: #666;
  text-align: center;
  margin-top: 15px;
  word-break: break-all;
}

.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.menu-grid button {
  min-height: 90px;
  background: white;
  border: 1px solid #e5eaf0;
  color: var(--blue);
  font-size: 15px;
}

.hidden {
  display: none !important;
}

.notice {
  background: #fff5e8;
  padding: 12px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.6;
  color: #80521c;
}

.item {
  border-bottom: 1px solid #eee;
  padding: 12px 0;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.item:last-child {
  border-bottom: none;
}

.positive {
  color: #e77b19;
  font-weight: bold;
}

.negative {
  color: #1765a8;
  font-weight: bold;
}

.small {
  font-size: 12px;
  color: #888;
}

#reader {
  width: 100%;
  overflow: hidden;
}

footer {
  text-align: center;
  color: #999;
  font-size: 11px;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>WINpharma POINT</h1>
  <p>人と人とのつながりを愛します</p>
</header>

<div class="container">

<!-- ログイン・登録 -->
<section id="loginScreen">

  <div class="card">
    <h2>ログイン</h2>

    <input id="loginEmail" type="email"
      placeholder="メールアドレス">

    <input id="loginPassword" type="password"
      placeholder="パスワード">

    <button class="primary" onclick="login()">
      ログイン
    </button>
  </div>

  <div class="card">
    <h2>新規会員登録</h2>

    <input id="registerEmail" type="email"
      placeholder="メールアドレス">

    <input id="registerPassword" type="password"
      placeholder="パスワード（6文字以上）">

    <button class="orange" onclick="register()">
      無料で会員登録
    </button>
  </div>

  <p id="authMessage"></p>

</section>


<!-- ホーム -->
<section id="homeScreen" class="hidden">

  <div class="balance">
    <small>現在のポイント</small>
    <strong id="pointBalance">0</strong>
    <small>POINT</small>
  </div>

  <div class="member-number">
    会員番号<br>
    <strong id="memberNumber"></strong>
  </div>

  <div class="card" style="margin-top:20px">
    <h2>メニュー</h2>

    <div class="menu-grid">

      <button onclick="showPage('qrPage')">
        📷<br>ポイントを貯める
      </button>

      <button onclick="showPage('historyPage')">
        📋<br>ポイント履歴
      </button>

      <button onclick="showPage('rewardPage')">
        🎁<br>景品と交換
      </button>

      <button onclick="showPage('memberPage')">
        👤<br>会員情報
      </button>

    </div>
  </div>

  <div class="notice">
    ※現在は試作版です。ポイントはデモ用として端末内に保存されます。
  </div>

</section>


<!-- QR読み取り -->
<section id="qrPage" class="hidden">

  <div class="card">
    <h2>ポイントを貯める</h2>

    <p>
      店舗スタッフから提示されたQRコードを
      カメラで読み取ってください。
    </p>

    <div id="reader"></div>

    <p id="qrMessage"></p>

    <button class="sub" onclick="stopScanner()">
      読み取りを終了
    </button>

    <button class="primary" onclick="showPage('homeScreen')">
      ホームに戻る
    </button>
  </div>

</section>


<!-- 履歴 -->
<section id="historyPage" class="hidden">

  <div class="card">
    <h2>ポイント履歴</h2>
    <div id="historyList"></div>

    <button class="primary" onclick="showPage('homeScreen')">
      戻る
    </button>
  </div>

</section>


<!-- 景品交換 -->
<section id="rewardPage" class="hidden">

  <div class="card">
    <h2>景品交換</h2>

    <p>
      現在のポイント：
      <strong id="rewardBalance">0</strong> pt
    </p>

    <div id="rewardList"></div>

    <button class="primary" onclick="showPage('homeScreen')">
      戻る
    </button>
  </div>

</section>


<!-- 会員情報 -->
<section id="memberPage" class="hidden">

  <div class="card">
    <h2>会員情報</h2>

    <p>メールアドレス</p>
    <strong id="memberEmail"></strong>

    <p style="margin-top:20px">会員番号</p>
    <strong id="memberNumber2"></strong>

    <button class="sub" onclick="logout()">
      ログアウト
    </button>

    <button class="primary" onclick="showPage('homeScreen')">
      戻る
    </button>
  </div>

</section>

</div>

<footer>
  WINpharma POINT
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// Firebase設定
const firebaseConfig = {
  apiKey: "AIzaSyDgPnM7g-lHMQ1_KqL-GVuMhJFWuOrXBLg",
  authDomain: "winpharma-point.firebaseapp.com",
  projectId: "winpharma-point",
  storageBucket: "winpharma-point.firebasestorage.app",
  messagingSenderId: "1045028388131",
  appId: "1:1045028388131:web:2847eaf400a71755d62096",
  measurementId: "G-SHM8XCJP9W"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let scanner = null;


// ポイント別QRコードで使用するポイント数
const allowedPoints = [1,5,10,15,20,25,30,35,40,45,50];


// 景品一覧（仮）
const rewards = [
  {name:"景品A", points:100, description:"100ポイントで交換"},
  {name:"景品B", points:300, description:"300ポイントで交換"},
  {name:"景品C", points:500, description:"500ポイントで交換"}
];


// デモデータ
function getDemoData() {
  return JSON.parse(
    localStorage.getItem("demo_" + currentUser.uid) ||
    '{"points":0,"history":[]}'
  );
}

function saveDemoData(data) {
  localStorage.setItem(
    "demo_" + currentUser.uid,
    JSON.stringify(data)
  );
}


// 会員登録
window.register = async function() {

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  try {

    const result = await createUserWithEmailAndPassword(
      auth, email, password
    );

    const user = result.user;

    await setDoc(doc(db, "members", user.uid), {
      uid: user.uid,
      points: 0,
      createdAt: serverTimestamp()
    });

    alert("会員登録が完了しました！");

  } catch(error) {
    alert("登録できませんでした：" + error.message);
  }
};


// ログイン
window.login = async function() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  try {

    await signInWithEmailAndPassword(
      auth, email, password
    );

  } catch(error) {
    alert("ログインできませんでした：" + error.message);
  }
};


// ログイン状態の確認
onAuthStateChanged(auth, async (user) => {

  if(user) {

    currentUser = user;

    try {

      const ref = doc(db, "members", user.uid);
      const snap = await getDoc(ref);

      if(!snap.exists()) {
        await setDoc(ref, {
          uid: user.uid,
          points: 0,
          createdAt: serverTimestamp()
        });
      }

      const memberNumber = "WF-" +
        user.uid.substring(0,8).toUpperCase();

      document.getElementById("memberNumber").textContent =
        memberNumber;

      document.getElementById("memberNumber2").textContent =
        memberNumber;

      document.getElementById("memberEmail").textContent =
        user.email;

      showPage("homeScreen");
      updateBalance();

    } catch(error) {
      alert("会員情報を読み込めませんでした：" + error.message);
    }

  } else {

    currentUser = null;
    showPage("loginScreen");

  }

});


// 画面切り替え
window.showPage = function(page) {

  stopScanner();

  const pages = [
    "loginScreen",
    "homeScreen",
    "qrPage",
    "historyPage",
    "rewardPage",
    "memberPage"
  ];

  pages.forEach(id => {
    document.getElementById(id).classList.add("hidden");
  });

  document.getElementById(page).classList.remove("hidden");

  if(page === "historyPage") updateHistory();
  if(page === "rewardPage") updateRewards();
  if(page === "qrPage") startScanner();

};


// ポイント表示
function updateBalance() {

  if(!currentUser) return;

  const data = getDemoData();

  document.getElementById("pointBalance").textContent =
    data.points;

  document.getElementById("rewardBalance").textContent =
    data.points;

}


// QR読み取り開始
async function startScanner() {

  document.getElementById("qrMessage").textContent =
    "QRコードを読み取ってください。";

  try {

    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 230, height: 230 }
      },
      (decodedText) => {

        processQR(decodedText);

      }
    );

  } catch(error) {

    document.getElementById("qrMessage").textContent =
      "カメラを起動できません。HTTPS接続とカメラの許可を確認してください。";

  }

}


// QR読み取り終了
window.stopScanner = async function() {

  if(scanner) {

    try {
      if(scanner.isScanning) {
        await scanner.stop();
      }
      scanner.clear();
    } catch(error) {}

    scanner = null;

  }

};


// QRコードの処理
async function processQR(text) {

  await stopScanner();

  const match = text.match(/^WINPHARMA_POINT:(\d+)$/);

  if(!match) {

    document.getElementById("qrMessage").textContent =
      "対応していないQRコードです。";

    return;
  }

  const points = Number(match[1]);

  if(!allowedPoints.includes(points)) {

    document.getElementById("qrMessage").textContent =
      "無効なポイントQRコードです。";

    return;
  }

  const data = getDemoData();

  data.points += points;

  data.history.unshift({
    type: "獲得",
    points: points,
    date: new Date().toLocaleString("ja-JP")
  });

  saveDemoData(data);

  updateBalance();

  document.getElementById("qrMessage").textContent =
    points + "ポイント獲得しました！";

  alert(points + "ポイント獲得しました！");

  showPage("homeScreen");

}


// 履歴表示
function updateHistory() {

  const data = getDemoData();

  const list = document.getElementById("historyList");

  if(data.history.length === 0) {
    list.innerHTML = "まだ履歴はありません。";
    return;
  }

  list.innerHTML = data.history.map(item => {

    const cls = item.type === "獲得"
      ? "positive"
      : "negative";

    const sign = item.type === "獲得" ? "+" : "-";

    return `
      <div class="item">
        <div>
          <strong>${item.type}</strong><br>
          <span class="small">${item.date}</span>
        </div>
        <div class="${cls}">
          ${sign}${item.points} pt
        </div>
      </div>
    `;

  }).join("");

}


// 景品一覧
function updateRewards() {

  const data = getDemoData();

  const list = document.getElementById("rewardList");

  list.innerHTML = rewards.map((reward,index) => `

    <div class="item">
      <div>
        <strong>${reward.name}</strong><br>
        <span class="small">${reward.description}</span>
      </div>

      <div>
        <strong>${reward.points} pt</strong>
        <button class="orange"
          onclick="exchangeReward(${index})">
          交換
        </button>
      </div>
    </div>

  `).join("");

}


// 景品交換
window.exchangeReward = function(index) {

  const reward = rewards[index];

  const data = getDemoData();

  if(data.points < reward.points) {
    alert("ポイントが足りません。");
    return;
  }

  if(!confirm(
    reward.name + "を" + reward.points +
    "ポイントで交換しますか？"
  )) return;

  data.points -= reward.points;

  data.history.unshift({
    type: "交換",
    points: reward.points,
    date: new Date().toLocaleString("ja-JP")
  });

  saveDemoData(data);

  updateBalance();
  updateRewards();

  alert("交換しました！");

};


// ログアウト
window.logout = async function() {

  await signOut(auth);

  alert("ログアウトしました。");

};

</script>

</body>
</html>
