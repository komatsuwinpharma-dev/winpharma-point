<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WINpharma POINT｜管理者画面</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  color: #263445;
}

header {
  background: #174b83;
  color: white;
  padding: 20px;
}

header h1 { margin: 0; font-size: 22px; }

.container {
  max-width: 1100px;
  margin: 25px auto;
  padding: 0 15px;
}

.card, .section {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px #0000000a;
}

input, select {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #d5dce5;
  border-radius: 8px;
  font-size: 15px;
}

button {
  padding: 11px 18px;
  border: none;
  border-radius: 7px;
  background: #174b83;
  color: white;
  cursor: pointer;
  font-size: 14px;
  margin: 3px;
}

.orange { background: #f39824; }
.red { background: #d9534f; }
.green { background: #299b68; }

.error { color: #d33; }

.notice {
  background: #fff4e5;
  border-left: 5px solid #f39824;
  padding: 12px;
  margin-bottom: 20px;
  font-size: 13px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.cards h2 {
  color: #174b83;
  font-size: 28px;
}

#dashboard { display: none; }

.menu {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.menu button {
  background: white;
  color: #174b83;
  border: 1px solid #dce3ec;
}

.menu button.active {
  background: #174b83;
  color: white;
}

.page { display: none; }
.page.active { display: block; }

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 13px 10px;
  border-bottom: 1px solid #edf0f4;
  text-align: left;
  font-size: 14px;
}

th { background: #f7f9fc; }

.table-wrap { overflow-x: auto; }

.balance {
  font-size: 25px;
  color: #174b83;
  font-weight: bold;
}

@media(max-width:600px) {
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <h1>WINpharma POINT</h1>
  <p>管理者専用ダッシュボード</p>
</header>

<div class="container">

  <!-- ログイン -->
  <div id="loginArea" class="card">
    <h2>管理者ログイン</h2>
    <input id="email" type="email" placeholder="メールアドレス">
    <input id="password" type="password" placeholder="パスワード">
    <button id="loginBtn">ログイン</button>
    <p id="loginError" class="error"></p>
  </div>

  <!-- 管理画面 -->
  <div id="dashboard">

    <div class="notice">
      現在はデモ画面です。
      ポイント操作と景品情報はこのブラウザ内に保存されます。
      実際の会員ポイントは変更されません。
    </div>

    <div class="card">
      ログイン中：<span id="adminEmail"></span>
      <button id="logoutBtn" class="orange">ログアウト</button>
    </div>

    <!-- 集計 -->
    <div class="cards">
      <div class="card">
        <p>総会員数</p>
        <h2 id="memberCount">0人</h2>
      </div>

      <div class="card">
        <p>保有ポイント合計（デモ）</p>
        <h2 id="totalPoints">0 pt</h2>
      </div>
    </div>

    <!-- メニュー -->
    <div class="menu">
      <button class="active" onclick="showPage('members',this)">会員管理</button>
      <button onclick="showPage('points',this)">ポイント管理</button>
      <button onclick="showPage('history',this)">操作履歴</button>
      <button onclick="showPage('prizes',this)">景品管理</button>
    </div>

    <!-- 会員管理 -->
    <div id="members" class="section page active">
      <h2>会員一覧</h2>

      <input id="search" placeholder="会員番号で検索">

      <p id="status">読み込み中...</p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>会員番号</th>
              <th>保有ポイント</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="memberList"></tbody>
        </table>
      </div>
    </div>

    <!-- ポイント管理 -->
    <div id="points" class="section page">
      <h2>ポイント管理</h2>

      <p>選択中の会員</p>
      <h3 id="selectedNumber">会員が選択されていません</h3>

      <p>現在のポイント</p>
      <div class="balance" id="selectedBalance">0 pt</div>

      <label>操作内容</label>
      <select id="operation">
        <option value="add">ポイント付与</option>
        <option value="subtract">ポイント減算</option>
      </select>

      <label>ポイント数</label>
      <input id="pointAmount" type="number" min="1" placeholder="例：10">

      <label>変更理由</label>
      <select id="reason">
        <option value="">理由を選択してください</option>
        <option value="購入ポイント">購入ポイント</option>
        <option value="キャンペーン">キャンペーン</option>
        <option value="ポイント調整">ポイント調整</option>
        <option value="その他">その他</option>
      </select>

      <button class="green" onclick="executeDemo()">操作内容を確認</button>

      <p id="pointMessage"></p>
    </div>

    <!-- 操作履歴 -->
    <div id="history" class="section page">
      <h2>ポイント操作履歴（デモ）</h2>

      <button class="red" onclick="clearHistories()">履歴を全削除</button>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日時</th>
              <th>会員番号</th>
              <th>操作</th>
              <th>ポイント</th>
              <th>理由</th>
            </tr>
          </thead>
          <tbody id="historyList"></tbody>
        </table>
      </div>
    </div>

    <!-- 景品管理 -->
    <div id="prizes" class="section page">
      <h2>景品管理</h2>

      <h3>景品を登録</h3>

      <label>景品名</label>
      <input id="prizeName" type="text" placeholder="例：オリジナルグッズ">

      <label>必要ポイント</label>
      <input id="prizePoints" type="number" min="1" placeholder="例：300">

      <label>在庫数</label>
      <input id="prizeStock" type="number" min="0" placeholder="例：10">

      <button class="green" onclick="addPrize()">景品を登録</button>

      <hr>

      <h3>登録済み景品一覧</h3>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>景品名</th>
              <th>必要ポイント</th>
              <th>在庫数</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="prizeList"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDgPnM7g-lHMQ1_KqL-GVuMhJFWuOrXBLg",
  authDomain: "winpharma-point.firebaseapp.com",
  projectId: "winpharma-point",
  storageBucket: "winpharma-point.firebasestorage.app",
  messagingSenderId: "1045028388131",
  appId: "1:1045028388131:web:2847eaf400a71755d62096",
  measurementId: "G-SHM8XCJP9W"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


// データ保存キー
const DEMO_KEY = "winpharmaAdminDemoData_v1";
const PRIZE_KEY = "winpharmaPrizes_v1";

let members = [];
let selectedMember = null;
let demoPoints = {};
let histories = [];
let prizes = [];


// 保存済みデモデータ読み込み
function loadDemoData() {
  try {
    const saved = JSON.parse(localStorage.getItem(DEMO_KEY) || "{}");

    demoPoints = saved.demoPoints || {};
    histories = saved.histories || [];

  } catch (e) {
    demoPoints = {};
    histories = [];
  }
}


// デモデータ保存
function saveDemoData() {
  localStorage.setItem(DEMO_KEY, JSON.stringify({
    demoPoints,
    histories
  }));
}


// 景品データ読み込み
function loadPrizes() {
  try {
    const saved = localStorage.getItem(PRIZE_KEY);

    if (saved !== null) {
      prizes = JSON.parse(saved);
    } else {
      prizes = [
        {
          id: Date.now() + 1,
          name: "ウインちゃんぬいぐるみ",
          points: 100,
          stock: 0
        },
        {
          id: Date.now() + 2,
          name: "日用品1つ",
          points: 300,
          stock: 0
        },
        {
          id: Date.now() + 3,
          name: "ウーマンズストーリー",
          points: 1000,
          stock: 0
        }
      ];

      savePrizes();
    }

  } catch (e) {
    prizes = [];
  }
}


// 景品データ保存
function savePrizes() {
  localStorage.setItem(PRIZE_KEY, JSON.stringify(prizes));
}


// ログイン
document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    document.getElementById("loginError").textContent = "";

  } catch (e) {
    document.getElementById("loginError").textContent =
      "ログインできません。入力内容を確認してください。";
  }
};


// ログイン状態確認
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    document.getElementById("loginArea").style.display = "block";
    document.getElementById("dashboard").style.display = "none";
    return;
  }

  try {

    const adminRef = doc(db, "admins", user.uid);
    const adminSnap = await getDoc(adminRef);

    if (!adminSnap.exists() || adminSnap.data().role !== "admin") {
      await signOut(auth);

      document.getElementById("loginError").textContent =
        "管理者権限がありません。";

      return;
    }

    document.getElementById("loginArea").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    document.getElementById("adminEmail").textContent = user.email;

    loadDemoData();
    loadPrizes();

    await loadMembers();

    renderHistory();
    renderPrizes();

  } catch (e) {

    console.error(e);

    document.getElementById("loginError").textContent =
      "データを取得できません。";

    await signOut(auth);
  }
});


// 会員一覧取得
async function loadMembers() {

  const status = document.getElementById("status");
  status.textContent = "読み込み中...";

  try {

    const snapshot = await getDocs(collection(db, "members"));

    members = snapshot.docs.map(item => ({
      uid: item.id,
      ...item.data()
    }));

    members.forEach(member => {

      if (demoPoints[member.uid] === undefined) {
        demoPoints[member.uid] = Number(member.points) || 0;
      }

    });

    saveDemoData();

    document.getElementById("memberCount").textContent =
      members.length + "人";

    renderMembers(members);
    updateTotal();

    status.textContent =
      members.length + "人の会員情報を取得しました。";

  } catch (e) {

    console.error(e);
    status.textContent = "会員情報を取得できませんでした。";
  }
}


// 会員番号
function memberNumber(member) {
  return "WF-" + member.uid.substring(0, 8).toUpperCase();
}


// 会員一覧表示
function renderMembers(list) {

  const tbody = document.getElementById("memberList");
  tbody.innerHTML = "";

  if (list.length === 0) {
    tbody.innerHTML =
      "<tr><td colspan='3'>該当する会員はいません</td></tr>";
    return;
  }

  list.forEach(member => {

    const tr = document.createElement("tr");

    const td1 = document.createElement("td");
    td1.textContent = memberNumber(member);

    const td2 = document.createElement("td");
    td2.textContent =
      (demoPoints[member.uid] || 0).toLocaleString() + " pt";

    const td3 = document.createElement("td");

    const button = document.createElement("button");
    button.textContent = "選択";
    button.onclick = () => selectMember(member);

    td3.appendChild(button);

    tr.append(td1, td2, td3);
    tbody.appendChild(tr);
  });
}


// 会員選択
function selectMember(member) {

  selectedMember = member;

  document.getElementById("selectedNumber").textContent =
    memberNumber(member);

  document.getElementById("selectedBalance").textContent =
    (demoPoints[member.uid] || 0).toLocaleString() + " pt";

  document.getElementById("pointMessage").textContent =
    "会員を選択しました。";

  showPageById("points");
}


// ページ切り替え
window.showPage = function(id, button) {

  document.querySelectorAll(".page").forEach(p => {
    p.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".menu button").forEach(b => {
    b.classList.remove("active");
  });

  button.classList.add("active");

  if (id === "history") renderHistory();
  if (id === "prizes") renderPrizes();
};


// 会員選択時のページ切り替え
function showPageById(id) {

  document.querySelectorAll(".page").forEach(p => {
    p.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".menu button").forEach(b => {
    b.classList.remove("active");
  });

  document.querySelectorAll(".menu button").forEach(button => {

    if (
      (id === "members" && button.textContent === "会員管理") ||
      (id === "points" && button.textContent === "ポイント管理") ||
      (id === "history" && button.textContent === "操作履歴") ||
      (id === "prizes" && button.textContent === "景品管理")
    ) {
      button.classList.add("active");
    }

  });
}


// ポイント操作
window.executeDemo = function() {

  const message = document.getElementById("pointMessage");

  if (!selectedMember) {
    message.textContent = "先に会員を選択してください。";
    return;
  }

  const amount = Number(document.getElementById("pointAmount").value);
  const operation = document.getElementById("operation").value;
  const reason = document.getElementById("reason").value;

  if (!Number.isInteger(amount) || amount <= 0) {
    message.textContent = "正しいポイント数を入力してください。";
    return;
  }

  if (!reason) {
    message.textContent = "変更理由を選択してください。";
    return;
  }

  const current = demoPoints[selectedMember.uid] || 0;

  if (operation === "subtract" && amount > current) {
    message.textContent = "保有ポイントが不足しています。";
    return;
  }

  const confirmText =
    memberNumber(selectedMember) + " に " +
    amount + " ptを" +
    (operation === "add" ? "付与" : "減算") +
    "しますか？\n理由：" + reason +
    "\n※デモ操作であり、実際のデータは変更されません。";

  if (!confirm(confirmText)) return;

  demoPoints[selectedMember.uid] =
    operation === "add" ? current + amount : current - amount;

  histories.unshift({
    date: new Date().toLocaleString("ja-JP"),
    number: memberNumber(selectedMember),
    operation: operation === "add" ? "付与" : "減算",
    amount: amount,
    reason: reason
  });

  saveDemoData();

  document.getElementById("selectedBalance").textContent =
    demoPoints[selectedMember.uid].toLocaleString() + " pt";

  document.getElementById("pointAmount").value = "";
  document.getElementById("reason").value = "";

  message.textContent = "デモ操作が完了しました。";

  renderMembers(members);
  updateTotal();
  renderHistory();
};


// 合計ポイント
function updateTotal() {

  const total = Object.values(demoPoints).reduce(
    (sum, point) => sum + Number(point || 0), 0
  );

  document.getElementById("totalPoints").textContent =
    total.toLocaleString() + " pt";
}


// 操作履歴表示
function renderHistory() {

  const tbody = document.getElementById("historyList");
  tbody.innerHTML = "";

  if (histories.length === 0) {
    tbody.innerHTML =
      "<tr><td colspan='5'>履歴はありません</td></tr>";
    return;
  }

  histories.forEach(item => {

    const tr = document.createElement("tr");

    [
      item.date,
      item.number,
      item.operation,
      item.amount + " pt",
      item.reason
    ].forEach(value => {

      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);

    });

    tbody.appendChild(tr);
  });
}


// 履歴全削除
window.clearHistories = function() {

  if (!confirm("操作履歴をすべて削除しますか？")) return;

  histories = [];

  saveDemoData();
  renderHistory();
};


// 会員番号検索
document.getElementById("search").addEventListener("input", e => {

  const keyword = e.target.value.trim().toUpperCase();

  const filtered = members.filter(member =>
    memberNumber(member).includes(keyword)
  );

  renderMembers(filtered);
});


// 景品登録
window.addPrize = function() {

  const name = document.getElementById("prizeName").value.trim();
  const points = Number(document.getElementById("prizePoints").value);
  const stock = Number(document.getElementById("prizeStock").value);

  if (!name) {
    alert("景品名を入力してください。");
    return;
  }

  if (!Number.isInteger(points) || points <= 0) {
    alert("必要ポイントを正しく入力してください。");
    return;
  }

  if (!Number.isInteger(stock) || stock < 0) {
    alert("在庫数を正しく入力してください。");
    return;
  }

  prizes.push({
    id: Date.now(),
    name: name,
    points: points,
    stock: stock
  });

  savePrizes();
  renderPrizes();

  document.getElementById("prizeName").value = "";
  document.getElementById("prizePoints").value = "";
  document.getElementById("prizeStock").value = "";

  alert("景品を登録しました。");
};


// 景品一覧表示
function renderPrizes() {

  const tbody = document.getElementById("prizeList");
  tbody.innerHTML = "";

  if (prizes.length === 0) {
    tbody.innerHTML =
      "<tr><td colspan='4'>登録されている景品はありません。</td></tr>";
    return;
  }

  prizes.forEach(prize => {

    const tr = document.createElement("tr");

    const td1 = document.createElement("td");
    td1.textContent = prize.name;

    const td2 = document.createElement("td");
    td2.textContent = Number(prize.points).toLocaleString() + " pt";

    const td3 = document.createElement("td");
    td3.textContent = prize.stock + " 個";

    const td4 = document.createElement("td");

    const editButton = document.createElement("button");
    editButton.textContent = "編集";
    editButton.onclick = () => editPrize(prize.id);

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "削除";
    deleteButton.className = "red";
    deleteButton.onclick = () => deletePrize(prize.id);

    td4.append(editButton, deleteButton);

    tr.append(td1, td2, td3, td4);
    tbody.appendChild(tr);
  });
}


// 景品編集
function editPrize(id) {

  const prize = prizes.find(item => item.id === id);
  if (!prize) return;

  const name = prompt("景品名を入力してください。", prize.name);
  if (name === null) return;

  const pointsText = prompt(
    "必要ポイントを入力してください。",
    prize.points
  );
  if (pointsText === null) return;

  const stockText = prompt(
    "在庫数を入力してください。",
    prize.stock
  );
  if (stockText === null) return;

  const points = Number(pointsText);
  const stock = Number(stockText);

  if (!name.trim()) {
    alert("景品名を入力してください。");
    return;
  }

  if (!Number.isInteger(points) || points <= 0) {
    alert("必要ポイントが正しくありません。");
    return;
  }

  if (!Number.isInteger(stock) || stock < 0) {
    alert("在庫数が正しくありません。");
    return;
  }

  prize.name = name.trim();
  prize.points = points;
  prize.stock = stock;

  savePrizes();
  renderPrizes();

  alert("景品情報を更新しました。");
}


// 景品削除
function deletePrize(id) {

  const prize = prizes.find(item => item.id === id);
  if (!prize) return;

  if (!confirm("「" + prize.name + "」を削除しますか？")) {
    return;
  }

  prizes = prizes.filter(item => item.id !== id);

  savePrizes();
  renderPrizes();

  alert("景品を削除しました。");
}


// ログアウト
document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
};

</script>

</body>
</html>
