<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WINpharma POINT｜管理者画面</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  color: #263445;
}

header {
  background: #174b83;
  color: white;
  padding: 20px;
}

header h1 { margin: 0; font-size: 22px; }

.container {
  max-width: 1100px;
  margin: 25px auto;
  padding: 0 15px;
}

.card, .section {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px #0000000a;
}

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #d5dce5;
  border-radius: 8px;
  font-size: 15px;
}

button {
  padding: 11px 18px;
  border: none;
  border-radius: 7px;
  background: #174b83;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

.orange { background: #f39824; }

.error { color: #d33; }

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.cards h2 {
  color: #174b83;
  font-size: 28px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 13px 10px;
  border-bottom: 1px solid #edf0f4;
  text-align: left;
  font-size: 14px;
}

th { background: #f7f9fc; }

.table-wrap { overflow-x: auto; }

#dashboard { display: none; }

@media(max-width:600px) {
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <h1>WINpharma POINT</h1>
  <p>管理者専用ダッシュボード</p>
</header>

<div class="container">

  <div id="loginArea" class="card">
    <h2>管理者ログイン</h2>

    <input id="email" type="email"
      placeholder="メールアドレス">

    <input id="password" type="password"
      placeholder="パスワード">

    <button id="loginBtn">ログイン</button>

    <p id="loginError" class="error"></p>
  </div>

  <div id="dashboard">

    <div class="card">
      <p>ログイン中：<span id="adminEmail"></span></p>
      <button id="logoutBtn" class="orange">ログアウト</button>
    </div>

    <div class="cards">
      <div class="card">
        <p>総会員数</p>
        <h2 id="memberCount">0人</h2>
      </div>

      <div class="card">
        <p>保有ポイント合計</p>
        <h2 id="totalPoints">0 pt</h2>
      </div>
    </div>

    <div class="section">
      <h2>会員一覧</h2>

      <input
        id="search"
        placeholder="会員番号で検索"
      >

      <p id="status">会員情報を読み込み中...</p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>会員番号</th>
              <th>保有ポイント</th>
              <th>登録状況</th>
            </tr>
          </thead>

          <tbody id="memberList"></tbody>
        </table>
      </div>
    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase設定
const firebaseConfig = {
  apiKey: "AIzaSyDgPnM7g-lHMQ1_KqL-GVuMhJFWuOrXBLg",
  authDomain: "winpharma-point.firebaseapp.com",
  projectId: "winpharma-point",
  storageBucket: "winpharma-point.firebasestorage.app",
  messagingSenderId: "1045028388131",
  appId: "1:1045028388131:web:2847eaf400a71755d62096",
  measurementId: "G-SHM8XCJP9W"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let members = [];

// ログイン
document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const error = document.getElementById("loginError");

  error.textContent = "";

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    error.textContent = "ログインできません。入力内容を確認してください。";
  }
};

// ログイン状態確認
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    document.getElementById("loginArea").style.display = "block";
    document.getElementById("dashboard").style.display = "none";
    return;
  }

  try {

    // 管理者情報を確認
    const adminRef = doc(db, "admins", user.uid);
    const adminSnap = await getDoc(adminRef);

    if (!adminSnap.exists() || adminSnap.data().role !== "admin") {
      await signOut(auth);
      document.getElementById("loginError").textContent =
        "管理者権限がありません。";
      return;
    }

    document.getElementById("loginArea").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    document.getElementById("adminEmail").textContent = user.email;

    await loadMembers();

  } catch (e) {

    document.getElementById("loginError").textContent =
      "データを取得できません。権限設定を確認してください。";

    console.error(e);
    await signOut(auth);
  }
});

// 会員一覧取得
async function loadMembers() {

  const status = document.getElementById("status");
  status.textContent = "読み込み中...";

  try {

    const snapshot = await getDocs(collection(db, "members"));

    members = snapshot.docs.map(item => ({
      uid: item.id,
      ...item.data()
    }));

    const total = members.reduce(
      (sum, member) => sum + (Number(member.points) || 0),
      0
    );

    document.getElementById("memberCount").textContent =
      members.length + "人";

    document.getElementById("totalPoints").textContent =
      total.toLocaleString() + " pt";

    renderMembers(members);

    status.textContent = members.length + "人の会員情報を取得しました。";

  } catch (e) {

    status.textContent = "会員情報の取得に失敗しました。";
    console.error(e);

  }
}

// 会員一覧表示
function renderMembers(list) {

  const tbody = document.getElementById("memberList");
  tbody.innerHTML = "";

  if (list.length === 0) {
    tbody.innerHTML =
      "<tr><td colspan='3'>該当する会員はいません</td></tr>";
    return;
  }

  list.forEach(member => {

    const number = "WF-" + member.uid.substring(0, 8).toUpperCase();

    const tr = document.createElement("tr");

    const td1 = document.createElement("td");
    td1.textContent = number;

    const td2 = document.createElement("td");
    td2.textContent =
      (Number(member.points) || 0).toLocaleString() + " pt";

    const td3 = document.createElement("td");
    td3.textContent = "登録済み";

    tr.append(td1, td2, td3);
    tbody.appendChild(tr);

  });
}

// 会員番号検索
document.getElementById("search").addEventListener("input", (e) => {

  const keyword = e.target.value.trim().toUpperCase();

  const filtered = members.filter(member => {

    const number = "WF-" + member.uid.substring(0, 8).toUpperCase();

    return number.includes(keyword);

  });

  renderMembers(filtered);

});

// ログアウト
document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
};

</script>

</body>
</html>
